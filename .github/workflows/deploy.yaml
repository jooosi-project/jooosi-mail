name: Deploy the plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  COMPOSER_ROOT_VERSION: dev-main

jobs:
  release:
    if: github.repository == 'jooosi-project/jooosi-mail'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm run build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Extract release notes
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "content<<EOF"
            node deploy/extract-changelog.mjs "$version"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update WordPress.org changelog
        run: node deploy/update-readme-changelog.mjs

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --ansi

      - name: Prepare production source
        run: |
          mkdir -p jooosi-mail-deploy
          rsync -a --exclude jooosi-mail-deploy --exclude .git ./ jooosi-mail-deploy/
          composer install --working-dir=jooosi-mail-deploy --no-dev --classmap-authoritative --no-interaction --prefer-dist --ansi

      - name: Scope production dependencies
        run: bash deploy/deploy-scoped.sh jooosi-mail-deploy jooosi-mail-prefixed

      - name: Apply distribution filter
        run: |
          mkdir -p jooosi-mail-final
          rsync -a --exclude='.*' --exclude-from=.distignore jooosi-mail-prefixed/ jooosi-mail-final/
          rm -rf jooosi-mail-prefixed
          mv jooosi-mail-final jooosi-mail-prefixed

      - name: Create plugin archive
        run: |
          mkdir -p jooosi-mail-zip/jooosi-mail
          cp -a jooosi-mail-prefixed/* jooosi-mail-zip/jooosi-mail/
          cd jooosi-mail-zip
          zip -qr "../jooosi-mail-${GITHUB_REF_NAME}.zip" . -x "*.git*" "*.DS_Store*"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: jooosi-mail-${{ github.ref_name }}
          path: jooosi-mail-${{ github.ref_name }}.zip

      - name: Publish scoped build to dist branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist-branch
          cd dist-branch
          git fetch origin dist || true
          git checkout dist 2>/dev/null || git checkout --orphan dist
          git rm -rf . 2>/dev/null || true
          git clean -fxd
          cp -a ../jooosi-mail-prefixed/* .
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "The dist branch already matches ${GITHUB_REF_NAME}."
          else
            git commit -m "Build ${GITHUB_REF_NAME}"
            git push origin dist
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content }}
          files: jooosi-mail-${{ github.ref_name }}.zip
          draft: false
          prerelease: false

      - name: Publish WordPress.org release
        id: wordpress_release
        if: vars.WORDPRESS_ORG_DEPLOY == 'true'
        continue-on-error: true
        timeout-minutes: 20
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: jooosi-mail
          BUILD_DIR: jooosi-mail-prefixed
          VERSION: ${{ github.ref_name }}
          ASSETS_DIR: .wordpress-org

      - name: Reset WordPress.org checkout for retry
        if: steps.wordpress_release.outcome == 'failure'
        run: rm -rf /home/runner/svn-jooosi-mail

      - name: Retry WordPress.org release
        if: steps.wordpress_release.outcome == 'failure'
        timeout-minutes: 20
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: jooosi-mail
          BUILD_DIR: jooosi-mail-prefixed
          VERSION: ${{ github.ref_name }}
          ASSETS_DIR: .wordpress-org
